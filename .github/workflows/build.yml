name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32s2
          path: '.'
      - name: Collect flashable binaries
        run: |
          mkdir -p out
          cp build/flipper_wifi_bridge.bin out/
          # .elf + .map so panics/coredumps can be symbolized off-device
          cp build/flipper_wifi_bridge.elf out/ 2>/dev/null || true
          cp build/flipper_wifi_bridge.map out/ 2>/dev/null || true
          cp build/bootloader/bootloader.bin out/
          cp build/partition_table/partition-table.bin out/
          # otadata selectors (switch INTO the bridge; switch back is wireless :2335)
          python3 make_otadata.py && cp otadata_ota0.bin otadata_ota1.bin otadata_ota1_altcrc.bin out/
          # record the exact flash offsets IDF used for our own artifacts
          grep -E 'bootloader.bin|partition-table.bin|flipper_wifi_bridge.bin' build/flash_args \
            > out/flash_offsets.txt || cp build/flash_args out/flash_offsets.txt
          cp FLASH_DUALBOOT.md out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: flipper-wifi-bridge-bins
          path: out/
